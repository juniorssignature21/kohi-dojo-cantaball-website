<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Reset your password</title>
</head>
<body style="font-family: Arial, sans-serif; background:#f7f3ef; padding:24px; color:#1f1f1f;">
  <div style="max-width:520px; margin:0 auto; background:#ffffff; border-radius:12px; padding:28px; border:1px solid #e8d3c4;">
    <h2 style="margin-top:0; color:#C2410C;">Reset your Kohi Dojo password</h2>
    <p>Hi{% if user.username %} {{ user.username }}{% endif %},</p>
    <p>We received a request to reset the password for <strong>{{ user.email }}</strong>.</p>
    <p style="margin:28px 0;">
      <a href="{{ reset_url }}"
         style="display:inline-block; background:#C2410C; color:#fff; text-decoration:none; padding:12px 20px; border-radius:8px; font-weight:600;">
        Reset password
      </a>
    </p>
    <p style="font-size:14px; color:#666;">Or copy this link:</p>
    <p style="font-size:13px; word-break:break-all; color:#444;">{{ reset_url }}</p>
    <p style="font-size:13px; color:#666; margin-bottom:0;">
      This link expires soon. If you did not request a reset, you can ignore this email.
    </p>
  </div>
</body>
</html>
